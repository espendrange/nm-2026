<script id="app-js">
(function(){
const RESET=":root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}";
const ORDER=["kandidat","uttatt","utvikling","ikke"];
const LABEL={kandidat:"Kandidat",uttatt:"Tatt ut",utvikling:"Utviklingsgruppe",ikke:"Ikke aktuell"};
let state=JSON.parse(document.getElementById("state").textContent);
let view="alle", readOnly=true, artifactNs=null, pending=false, timer=null, adding=null;
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const club=c=>c?`(${esc(c)} Taekwon-Do klubb)`:"";

function setSave(t){const el=document.getElementById("save"); if(el) el.textContent=t;}

function render(){
  const groups=["SENIOR","JUNIOR"];
  let h=`<header class="top"><div><h1>Landslagsuttak 2027</h1><p>Kandidater fra VM 2025, EM 2026, World Cup 2026 og NM 2025. NM 2026 fylles inn i helga.</p></div>
  <div class="ctrl"><div class="seg" role="group" aria-label="Visning">
  <button type="button" data-view="alle" aria-pressed="${view==="alle"}">Alle kandidater</button>
  <button type="button" data-view="uttak" aria-pressed="${view==="uttak"}">Uttak</button></div>
  <span class="save" id="save" aria-live="polite">Lesekopi · oppdatert 05.11. kl. 16:13</span></div></header>`;
  if(view==="alle") h+=`<div class="legend"><span>De to over streken er førstevalget i klassen.</span><span>VM = VM 2025, EM = EM 2026, WC = World Cup 2026, NM = NM 2025</span></div>`;
  for(const g of groups){
    h+=`<h2>${g}</h2>`;
    if(g==="JUNIOR") h+=`<p class="ylegend"><span class="aged">Født 2008 – senior</span><span class="y2009">Født 2009</span><span class="y2010">Født 2010</span><span class="y2011">Født 2011</span></p>`;
    state.sections.forEach((s,si)=>{ if(s.g!==g) return;
      h+=`<section class="sec" data-k="${s.k}"><div class="sec-h">${esc(s.t.toUpperCase())}</div><div class="grid">`;
      s.cl.forEach((c,ci)=>{
        const list=c.x.map((p,pi)=>({p,pi})).filter(o=>view==="alle"||o.p.s==="uttatt");
        h+=`<div class="cls" data-c="${si}.${ci}"><div class="cls-h">${esc(c.n)}</div><ul class="cands">`;
        if(!list.length) h+=`<li class="empty">${view==="alle"?"Ingen kandidater ennå":"Ingen tatt ut"}</li>`;
        for(const {p,pi} of list){
          h+=`<li class="cand" data-s="${p.s}"${view==="alle"&&!readOnly?` draggable="true" data-d="${si}.${ci}.${pi}"`:""}><div class="nm"><span class="${s.g==="JUNIOR"&&p.y==="2008"?"aged":(/^20(08|09|10|11)$/.test(p.y||"")?"y"+p.y:"")}">${esc(p.n)}</span></div><div class="club">${club(p.c)}</div>`;
          if(view==="alle"){
            h+=`<div class="merit">${esc(p.m||"")}</div><div class="row">
            <button type="button" class="mv" data-mv="-1" data-k="${si}.${ci}.${pi}" aria-label="Flytt ${esc(p.n)} opp" ${pi===0?"disabled":""}>↑</button><button type="button" class="mv" data-mv="1" data-k="${si}.${ci}.${pi}" aria-label="Flytt ${esc(p.n)} ned" ${pi===c.x.length-1?"disabled":""}>↓</button>
            ${s.g==="JUNIOR"&&p.y==="2008"?`<button type="button" class="pill senior" disabled aria-label="${esc(p.n)} blir senior">Senior</button>`:`<button type="button" class="pill" data-s="${p.s}" data-k="${si}.${ci}.${pi}" aria-label="Status for ${esc(p.n)}: ${LABEL[p.s]}. Trykk for å endre.">${LABEL[p.s]}</button>`}
            <input class="nm26" data-k="${si}.${ci}.${pi}" value="${esc(p.r||"")}" placeholder="NM 2026-resultat" aria-label="NM 2026-resultat for ${esc(p.n)}" ${readOnly?"readonly":""}>${s.g==="JUNIOR"?`<select class="yr" data-k="${si}.${ci}.${pi}" aria-label="Fødselsår for ${esc(p.n)}" ${readOnly?"disabled":""}>${["","2007","2008","2009","2010","2011","Annet"].map(v=>`<option value="${v}" ${(p.y||"")===v?"selected":""}>${v||"Født"}</option>`).join("")}</select>`:""}</div>`;
          } else if(p.r){ h+=`<div class="merit">NM 2026: ${esc(p.r)}</div>`; }
          h+=`</li>`;
        }
        h+=`</ul>`;
        if(view==="alle"&&!readOnly){
          if(adding===`${si}.${ci}`) h+=`<form class="addform" data-k="${si}.${ci}"><input name="n" placeholder="Navn" aria-label="Navn" required><input name="c" placeholder="Klubb (f.eks. Bergen)" aria-label="Klubb"><input name="m" placeholder="Meritter" aria-label="Meritter"><div class="bt"><button type="submit">Legg til</button><button type="button" data-cancel>Avbryt</button></div></form>`;
          else h+=`<div class="add"><button type="button" data-add="${si}.${ci}">Legg til kandidat</button></div>`;
        }
        h+=`</div>`;
      });
      h+=`</div></section>`;
    });
    const utv=[];
    state.sections.forEach(s=>{ if(s.g!==g) return; s.cl.forEach(c=>c.x.forEach(p=>{ if(p.s==="utvikling" && !utv.some(u=>u.n===p.n)) utv.push({n:p.n,c:p.c,y:p.y,k:s.t.split(" ")[0]}); })); });
    if(view==="uttak"||utv.length){
      h+=`<aside class="utv"><div class="utv-h">UTVIKLINGSGRUPPE</div><div class="utv-sub">Ikke med til EM, men deltar på samlinger</div><ul>`;
      if(!utv.length) h+=`<li class="empty">Ingen satt i utviklingsgruppen ennå</li>`;
      for(const kind of ["Sparring","Mønster","Spesialteknikk","Knusing"]){
        const l=utv.filter(u=>u.k===kind); if(!l.length) continue;
        h+=`<li class="k">${kind.toUpperCase()}</li>`+l.map(u=>`<li><span class="nmk ${g==="JUNIOR"&&u.y==="2008"?"aged":(/^20(08|09|10|11)$/.test(u.y||"")?"y"+u.y:"")}">${esc(u.n)}</span> <span>${club(u.c)}</span></li>`).join("");
      }
      h+=`</ul></aside>`;
    }
  }
  app.innerHTML=h;
  app.classList.toggle("ro",readOnly);
  app.classList.toggle("v-alle",view==="alle");
  if(adding){const f=app.querySelector(".addform input"); f&&f.focus();}
}

function get(k){const [a,b,c]=k.split(".").map(Number); return state.sections[a].cl[b].x[c];}
function changed(){ if(readOnly) return; pending=true; setSave("Ikke lagret"); clearTimeout(timer); timer=setTimeout(save,1500); }

function buildDoc(){
  // same shell the Artifact tool publishes, so a later publish from the tool replaces it instead of nesting it
  const css=document.getElementById("css").textContent;
  const js=document.getElementById("app-js").textContent;
  const shell='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>';
  const head='<title>Landslagsuttak 2027 – kandidater</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">\n';
  const json=JSON.stringify(state).replace(/</g,"\\u003c");
  return `${shell}${head}<style id="css">${css}</style>\n<div class="wrap" id="app"></div>\n<script type="application/json" id="state">${json}<\/script>\n<script id="app-js">${js}<\/script>\n</body></html>`;
}
async function save(){
  if(!pending||readOnly) return;
  if(!artifactNs){ setSave("Venter på lagring…"); return; }
  pending=false; setSave("Lagrer…");
  try{ await artifactNs.publish(buildDoc()); setSave("Lagret"); }
  catch(e){
    const code=e&&e.code;
    if(code==="not_writer"||code==="not_granted"||code==="not_declared"){ readOnly=true; render(); setSave("Kun lesetilgang"); }
    else if(code==="conflict"){ setSave("Oppdatert av andre – laster inn"); }
    else if(code==="rate_limited"){ pending=true; setSave("Ikke lagret"); clearTimeout(timer); timer=setTimeout(save,8000); }
    else { pending=true; setSave("Ikke lagret – prøv igjen"); }
  }
}

app.addEventListener("click",e=>{
  const v=e.target.closest("[data-view]"); if(v){ view=v.dataset.view; adding=null; render(); return; }
  const mv=e.target.closest(".mv"); if(mv&&!readOnly){ const [a,b,c]=mv.dataset.k.split(".").map(Number); const d=Number(mv.dataset.mv); const arr=state.sections[a].cl[b].x; const j=c+d; if(j<0||j>=arr.length) return; [arr[c],arr[j]]=[arr[j],arr[c]]; render(); const f=app.querySelector(`.mv[data-k="${a}.${b}.${j}"][data-mv="${d}"]:not([disabled])`)||app.querySelector(`.mv[data-k="${a}.${b}.${j}"]:not([disabled])`); f&&f.focus(); changed(); return; }
  const p=e.target.closest(".pill"); if(p&&!readOnly){ const o=get(p.dataset.k); o.s=ORDER[(ORDER.indexOf(o.s)+1)%ORDER.length]; render(); const again=app.querySelector(`.pill[data-k="${p.dataset.k}"]`); again&&again.focus(); changed(); return; }
  const a=e.target.closest("[data-add]"); if(a){ adding=a.dataset.add; render(); return; }
  if(e.target.closest("[data-cancel]")){ adding=null; render(); }
});
app.addEventListener("submit",e=>{
  e.preventDefault(); const f=e.target; const [a,b]=f.dataset.k.split(".").map(Number);
  const n=f.n.value.trim(); if(!n) return;
  state.sections[a].cl[b].x.push({n,c:f.c.value.trim(),m:f.m.value.trim(),s:"kandidat",r:""});
  adding=null; render(); changed();
});
app.addEventListener("change",e=>{
  if(e.target.classList.contains("nm26")){ get(e.target.dataset.k).r=e.target.value.trim(); changed(); }
  if(e.target.classList.contains("yr")){ const v=e.target.value, n=get(e.target.dataset.k).n; state.sections.forEach(s=>{ s.cl.forEach(c=>c.x.forEach(x=>{ if(x.n===n) x.y=v; })); }); render(); changed(); }
});

let drag=null;
app.addEventListener("dragstart",e=>{const li=e.target.closest("[data-d]"); if(!li||e.target.closest("input")) return; drag=li.dataset.d; e.dataTransfer.effectAllowed="move"; try{e.dataTransfer.setData("text/plain",drag)}catch(_){} li.classList.add("dragging");});
app.addEventListener("dragend",()=>{drag=null; app.querySelectorAll(".dragging,.over,.over-cls").forEach(el=>el.classList.remove("dragging","over","over-cls"));});
app.addEventListener("dragover",e=>{if(!drag) return; const li=e.target.closest("[data-d]"), cl=e.target.closest("[data-c]"); const tk=li?li.dataset.d:(cl?cl.dataset.c:null); if(!tk) return; if(drag.split(".")[0]!==tk.split(".")[0]) return; e.preventDefault(); app.querySelectorAll(".over,.over-cls").forEach(el=>el.classList.remove("over","over-cls")); if(li) li.classList.add("over"); if(cl) cl.classList.add("over-cls");});
app.addEventListener("drop",e=>{if(!drag) return; const li=e.target.closest("[data-d]"), cl=e.target.closest("[data-c]"); if(!li&&!cl) return; const s=drag.split(".").map(Number); const tc=(li?li.dataset.d:cl.dataset.c).split(".").map(Number); if(s[0]!==tc[0]) return; e.preventDefault(); const sec=state.sections[s[0]]; const src=sec.cl[s[1]].x, dst=sec.cl[tc[1]].x; if(s[1]===tc[1]){ if(!li){drag=null; render(); return;} const [it]=src.splice(s[2],1); src.splice(tc[2],0,it); } else { if(dst.some(x=>x.n===src[s[2]].n)){drag=null; render(); return;} const [it]=src.splice(s[2],1); if(li) dst.splice(tc[2],0,it); else dst.push(it); } drag=null; render(); changed();});

render();
})();
</script>
</body></html>
