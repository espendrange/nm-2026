<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noimageindex"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>NM-hallen 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Public+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Phone first: day and time, the hall as it stands (5-8 left, 4-1 right) with now and next per ring, and the draw sheet of the tapped ring. */
:root{
  --ground:#E7EDF5; --surface:#FFFFFF; --sunken:#DCE4EE; --floor:#F1F5F9;
  --ink:#0C1B29; --ink-2:#40566B; --ink-3:#6E8399;
  --rule:#C3D1E0; --rule-soft:#D6E0EC;
  --navy:#0C1B29; --brand:#2E7EB5;
  --now:#C8201B; --next:#A8670A;
  --trib:#F1E3A2; --trib-ink:#6B5A12;
  --f:#C2187F; --f-soft:#F8D3E9; --m:#0A8A84; --m-soft:#C9EEEA;
  --belt:#121212; --belt-edge:transparent; --gold:#E8B931;
  --hl:#FFE066;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ground:#0A1522; --surface:#16304A; --sunken:#11263B; --floor:#0F2236;
  --ink:#E8EFF6; --ink-2:#A8BCCE; --ink-3:#7E93A8;
  --rule:#2D4E70; --rule-soft:#27486A; --brand:#6FB4E2;
  --now:#FF5A4D; --next:#F0B14A;
  --trib:#3A3418; --trib-ink:#E3D27E;
  --f:#F27AC6; --f-soft:#5C1E47; --m:#4FD8CF; --m-soft:#0E4A47; --belt-edge:rgba(255,255,255,.35);
  --hl:#7A6416;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0A1522; --surface:#16304A; --sunken:#11263B; --floor:#0F2236;
  --ink:#E8EFF6; --ink-2:#A8BCCE; --ink-3:#7E93A8;
  --rule:#2D4E70; --rule-soft:#27486A; --brand:#6FB4E2;
  --now:#FF5A4D; --next:#F0B14A;
  --trib:#3A3418; --trib-ink:#E3D27E;
  --f:#F27AC6; --f-soft:#5C1E47; --m:#4FD8CF; --m-soft:#0E4A47; --belt-edge:rgba(255,255,255,.35);
  --hl:#7A6416;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.wrap{max-width:52rem;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:0 48px;display:grid;gap:14px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
a{color:var(--brand)}

/* sticky time bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:#fff;margin-inline:calc(-1*max(12px,env(safe-area-inset-left,0px)));padding:8px max(12px,env(safe-area-inset-left,0px)) 6px;display:grid;gap:6px}
.bar .row{display:flex;align-items:center;gap:8px}
.brand{font-family:var(--display);font-weight:800;font-stretch:75%;font-size:1.05rem;letter-spacing:.01em;line-height:1}
.brand small{display:block;font-family:var(--mono);font-weight:500;font-size:.6rem;letter-spacing:.08em;color:#9FC3E0;text-transform:uppercase}
.seg{display:inline-flex;border:1px solid #3B5674;border-radius:999px;overflow:hidden;margin-left:auto}
.seg button{border:0;background:none;color:#CFE0EE;padding:5px 11px;cursor:pointer;font-weight:600;font-size:.85rem}
.seg button[aria-pressed="true"]{background:#fff;color:var(--navy)}
.clock{font-family:var(--mono);font-weight:600;font-size:1.3rem;font-variant-numeric:tabular-nums}
.nowbtn{border:1px solid #3B5674;background:none;color:#fff;border-radius:6px;padding:4px 9px;font-size:.8rem;font-weight:600;cursor:pointer}
.density{display:flex;align-items:flex-end;height:12px;gap:1px}
.density i{flex:1;background:#FF6A5E;border-radius:1px 1px 0 0}
.density i.z{background:#2A4560}
input[type=range]{width:100%;margin:0;accent-color:#FF6A5E}

/* hall */
.hall{background:var(--floor);border:2px solid var(--ink-3);border-radius:4px;padding:6px;display:grid;
  grid-template-columns:12px minmax(0,1fr) 14px minmax(0,1fr) 12px;grid-template-rows:auto repeat(4,auto);gap:6px}
.screen{grid-column:2/5;justify-self:center;font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);border-bottom:3px solid var(--ink-3);padding:0 14px 1px}
.trib{grid-row:2/6;background:var(--trib);border-radius:2px}
.trib.l{grid-column:1}.trib.r{grid-column:5}
.sek{grid-column:3;grid-row:3/5;align-self:center;writing-mode:vertical-rl;background:var(--brand);color:#fff;font-family:var(--mono);font-size:.52rem;letter-spacing:.08em;text-transform:uppercase;padding:8px 1px;border-radius:2px;justify-self:center}
.ring{font:inherit;color:inherit;width:100%;text-align:left;background:var(--surface);border:2px solid var(--rule);border-radius:4px;padding:6px 7px 7px;display:grid;gap:3px;align-content:start;min-height:7.6rem;cursor:pointer;min-width:0}
.ring .top{display:flex;justify-content:space-between;align-items:center}
.ring .num{font-family:var(--display);font-weight:800;font-stretch:70%;font-size:1.7rem;line-height:.9;color:var(--ink-2)}
.ring .cnt{font-family:var(--mono);font-size:.78rem;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--now);color:#fff}
.ring .when{font-family:var(--mono);font-size:.68rem;color:var(--ink-2)}
.ring .nxt{font-size:.72rem;color:var(--next);font-weight:600}
.ring .cls{font-size:.86rem;line-height:1.3;overflow-wrap:anywhere}
.ring.idle{background:var(--sunken)}
.ring .nx{border-top:1px dashed var(--rule);padding-top:4px;margin-top:2px;display:grid;gap:1px}
.ring .nx .nl{font-family:var(--mono);font-size:.64rem;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.ring .nx .cls{font-size:.76rem;opacity:.8}
.tabs{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden}
.tabs button{border:0;background:none;padding:4px 10px;font-size:.8rem;font-weight:600;cursor:pointer;font-family:var(--mono)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.ring.sel{outline:3px solid var(--brand);outline-offset:1px}

/* category label */
.disc{display:inline-block;font-family:var(--mono);font-size:.6rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;line-height:1;padding:3px 5px;border-radius:3px;border:2px solid var(--ink);margin:0 5px 3px 0;vertical-align:1px}
.disc.sp{background:var(--ink);color:var(--surface)}
.disc.mo{background:var(--surface);color:var(--ink)}
.disc.st{background:var(--surface);color:var(--ink);border-style:dashed}
.disc.kn{background:var(--surface);color:var(--ink);border-style:dotted}
.cat{font-family:var(--display);font-weight:800;font-stretch:85%;background:var(--m-soft);border-left:5px solid var(--m);padding:1px 5px;border-radius:2px;box-decoration-break:clone;-webkit-box-decoration-break:clone;line-height:1.6}
.cat.F{background:var(--f-soft);border-left-color:var(--f)}
.belt{display:inline-flex;align-items:center;justify-content:flex-end;position:relative;min-width:24px;height:11px;padding:0 2px 0 11px;border-radius:2px;background:var(--belt);box-shadow:0 0 0 1px var(--belt-edge);margin-right:5px;vertical-align:-1px}
.belt.jr::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;background:#fff}
.belt b{position:relative;background:var(--belt);color:var(--gold);font:800 8px/11px var(--display);padding:0 1px}

/* panel */
.panel{background:var(--surface);border-radius:6px;padding:12px;display:grid;gap:10px;scroll-margin-top:96px}
.panel .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.panel .rn{font-family:var(--display);font-weight:800;font-stretch:75%;font-size:1.5rem;line-height:1}
.panel .tm{font-family:var(--mono);font-size:.78rem;color:var(--ink-2)}
.panel .x{margin-left:auto;border:0;background:none;font-size:1.3rem;line-height:1;cursor:pointer;color:var(--ink-3);padding:2px 6px}
.panel .ttl{font-size:1.15rem}
.people{list-style:none;margin:0;padding:0;display:grid}
.people li{padding:7px 0;border-top:1px solid var(--rule-soft);display:grid;gap:1px}
.people b{font-size:.95rem}
.people b small{font-weight:400;color:var(--ink-3)}
.people .w{font-size:.84rem;color:var(--ink-2)}
.as{font-family:var(--mono);font-size:.62rem;color:var(--ink-3);border:1px dashed var(--ink-3);border-radius:3px;padding:0 4px;margin-left:4px}
.sheet{display:grid;gap:4px}
.sheet .sc{overflow-x:auto;overflow-y:hidden;border:1px solid var(--rule);border-radius:4px;background:#fff}
.sheet img{display:block;width:860px;max-width:none;height:auto}
.sheet.fit img{width:100%}
.sheet .tools{display:flex;justify-content:space-between;align-items:center;font-size:.76rem;color:var(--ink-3)}
.sheet .tools button{border:1px solid var(--rule);background:var(--surface);border-radius:5px;padding:3px 8px;font-size:.76rem;font-weight:600;cursor:pointer}
.hint{font-size:.82rem;color:var(--ink-3);margin:0}

/* plan */
h2{font-family:var(--display);font-weight:800;font-stretch:85%;font-size:1.15rem;margin:6px 0 0}
.plan{background:var(--surface);border-radius:6px;overflow:hidden}
.slot{display:grid;grid-template-columns:3.1rem 2.1rem minmax(0,1fr);gap:8px;padding:9px 10px;border-top:1px solid var(--rule-soft);cursor:pointer;align-items:start}
.slot:first-child{border-top:0}
.slot .t{font-family:var(--mono);font-size:.82rem;font-weight:600;font-variant-numeric:tabular-nums}
.slot .r{font-family:var(--display);font-weight:800;font-stretch:75%;font-size:1.05rem;line-height:1.1}
.slot .c{min-width:0;font-size:.86rem}
.slot .nm{display:block;font-size:.78rem;color:var(--ink-2);margin-top:2px}
.slot.live{box-shadow:inset 4px 0 0 var(--now)}
.slot.past{opacity:.45}
.slot.sel{background:var(--sunken)}

/* folded sections */
details{background:var(--surface);border-radius:6px}
summary{padding:11px 12px;cursor:pointer;font-family:var(--display);font-weight:800;font-stretch:85%;font-size:1.05rem}
.fold{padding:0 12px 12px;display:grid;gap:8px}
.search{width:100%;border:1px solid var(--rule);background:var(--ground);border-radius:6px;padding:7px 10px;font:inherit;color:var(--ink)}
.prow{padding:8px 0;border-top:1px solid var(--rule-soft);display:grid;gap:3px}
.prow .st{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:.74rem;padding:2px 7px;border-radius:3px;background:var(--sunken);cursor:pointer;border:0;white-space:nowrap}
.chip.dim{background:none;color:var(--ink-3);font-style:italic;cursor:default}
.gh{font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding-top:6px}
.key{display:grid;gap:6px;font-size:.84rem;color:var(--ink-2)}
.key div{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block;border:2px solid var(--rule)}
@media (min-width:700px){
  .hall{grid-template-columns:28px minmax(0,1fr) 30px minmax(0,1fr) 28px;gap:8px;padding:8px}
  .ring{min-height:8.6rem;padding:8px 9px}
  .ring .num{font-size:2rem}
  .ring .cls{font-size:.95rem}
}
@media (prefers-reduced-motion:no-preference){.ring{transition:border-color .2s}}
.ring .top{display:flex;align-items:center;gap:8px}
.ring .top .ico{margin-left:auto}
.ico{width:26px;height:26px;flex:none;fill:none;stroke:var(--ink);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:17px;height:17px;stroke-width:2.2;opacity:.85}
.belt{min-width:30px;height:12px;padding:0 3px 0 12px;margin-right:0}
.belt b{font:800 9px/12px var(--display);letter-spacing:.03em}
.belt.big{min-width:46px;height:18px;padding:0 4px 0 16px}
.belt.big b{font-size:13px;line-height:18px;padding:0 2px}
.belt.big.jr::before{height:4px;margin-top:-2px}
.ring .cls{font-size:1.12rem;line-height:1.35}
.ring .when{font-size:.82rem;font-weight:600;color:var(--ink)}
.ring{min-height:8.4rem}
@media (max-width:420px){.ring .cls{font-size:1rem}}
.ring .nrow{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.ring .nrow .cat{font-size:.78rem}
.panel .ttl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ring.idle .when{font-size:.8rem}
.ring.quiet{background:var(--sunken)}
.ring.quiet .cls,.ring.quiet .when,.nx.quiet .nrow .cat{opacity:.38;filter:grayscale(1)}
.agekey{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.76rem;color:var(--ink-2)}
.agekey span{display:inline-flex;align-items:center;gap:5px}
.agekey i{width:18px;height:10px;border-radius:2px;display:inline-block}
.agekey .r{background:#FF7373}.agekey .y{background:#FFE026}.agekey .g{background:#73D966}.agekey .o{background:#FFA640}.agekey .s{background:#8CBFFF}
.seg.view{margin-left:0}
.bar .row{flex-wrap:wrap;row-gap:6px}
.seg button{padding:5px 9px}
.dv{overflow:auto;max-height:calc(100dvh - 110px);background:var(--surface);border-radius:6px;--tc:44px}
.dvg{position:relative;min-width:calc(44px + 8 * 104px)}
.dvh{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:var(--tc) repeat(8,1fr);height:28px;background:var(--surface);border-bottom:1px solid var(--rule)}
.dvh span{font-family:var(--display);font-weight:800;font-stretch:75%;font-size:.95rem;display:flex;align-items:center;justify-content:center}
.dvt{position:absolute;left:0;width:100%;border-top:1px solid var(--rule-soft);font-family:var(--mono);font-size:.62rem;color:var(--ink-3);padding-left:4px}
.blk{position:absolute;width:calc((100% - var(--tc)) / 8 - 4px);margin-left:2px;border:0;border-left:4px solid var(--m);background:var(--m-soft);border-radius:3px;padding:3px 5px;text-align:left;font:inherit;color:var(--ink);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:flex-start;z-index:1}
.blk.F{border-left-color:var(--f);background:var(--f-soft)}
.blk.N{border-left-color:var(--ink-3);background:var(--sunken)}
.blk .nm{font-family:var(--display);font-weight:800;font-stretch:85%;font-size:.78rem;line-height:1.15}
.blk .tt{font-family:var(--mono);font-size:.6rem;color:var(--ink-2)}
.blk.short{padding:0 4px;flex-direction:row}
.blk.short .nm{font-size:.6rem;font-weight:600;white-space:nowrap}
.blk.quiet{background:var(--sunken);border-left-color:var(--rule)}
.blk.quiet .nm,.blk.quiet .tt{opacity:.45}
.blk.lunch{background:repeating-linear-gradient(45deg,var(--sunken) 0 6px,transparent 6px 12px);border-left-color:transparent;color:var(--ink-3);font-size:.7rem;cursor:default}
.panel .sd{font-size:.82rem;font-weight:600;text-decoration:none;border:1px solid var(--rule);border-radius:5px;padding:3px 8px}
.prog{height:6px;background:var(--rule-soft);border-radius:3px;overflow:hidden;margin-top:2px}
.prog i{display:block;height:100%;background:var(--ink-2);border-radius:3px}
.left{font-family:var(--mono);font-size:.74rem;font-weight:600}
.strip{position:relative;height:14px;background:var(--floor);border:1px solid var(--rule-soft);border-radius:2px;overflow:hidden;margin-top:5px}
.strip i{position:absolute;top:0;bottom:0;border-right:2px solid var(--surface)}
.strip i.c.M{background:var(--m)}.strip i.c.F{background:var(--f)}.strip i.c.N{background:var(--ink-3)}
.strip i.q{background:var(--rule)}
.strip i.l{background:repeating-linear-gradient(45deg,var(--rule) 0 3px,transparent 3px 6px)}
.strip .now{position:absolute;left:0;top:0;bottom:0;width:3px;background:#FF6A5E}
.ticks2{position:relative;height:12px;font-family:var(--mono);font-size:.56rem;color:var(--ink-3)}
.ticks2 span{position:absolute;transform:translateX(-50%)}
.faces{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.face{flex:none;width:68px;display:grid;justify-items:center;gap:4px;text-align:center}
.av{width:56px;height:56px;border-radius:50%;border:4px solid #8CBFFF;background:var(--sunken);display:grid;place-items:center;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av span{font-family:var(--display);font-weight:800;font-size:1.1rem;color:var(--ink-2)}
.av.r{border-color:#FF7373}.av.y{border-color:#FFE026}.av.g{border-color:#73D966}.av.o{border-color:#FFA640}
.fn{font-size:.7rem;line-height:1.2;font-weight:600;overflow-wrap:anywhere}
.pn{font-size:.72rem;font-weight:600;line-height:1.2;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.pn.r::after,.pn.y::after,.pn.g::after,.pn.o::after{content:"";width:7px;height:7px;border-radius:50%;flex:none;order:2}
.pn .bn{order:0}
.pn.r::after{background:#FF5C5C}.pn.y::after{background:#F2C200}.pn.g::after{background:#4CC23F}.pn.o::after{background:#FF9A2E}
.wt{display:inline-flex;align-items:center;font-style:normal;font-family:var(--display);font-weight:800;font-stretch:85%;font-size:10px;line-height:1;height:13px;padding:0 4px;border-radius:2px;background:var(--ink);color:var(--surface)}
.wt.big{font-size:14px;height:20px;padding:0 6px;border-radius:3px}
.ring .top .belt+.wt{margin-left:-2px}
.blk .bw{display:inline-flex;gap:4px;align-items:center}
.bn{display:inline-block;min-width:18px;text-align:center;font-family:var(--mono);font-size:.64rem;font-weight:600;line-height:1;padding:2px 3px;border-radius:2px;color:#fff;font-style:normal}
.bn.r{background:#C8201B}.bn.b{background:#3B4FE0}
.panel .tools{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.panel .sd.live{background:var(--brand);color:#fff;border-color:var(--brand);padding:6px 12px;font-size:.9rem}
.panel:not([hidden]){position:fixed;inset:0;z-index:30;display:block;padding:0;border-radius:0;overflow:auto;background:var(--ground);-webkit-overflow-scrolling:touch}
body.ovopen{overflow:hidden}
.ovh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--navy);padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
.ovh .pl{color:#CFE0EE;font-size:.82rem;font-family:var(--mono)}
.ovh .zoom{border:1px solid #3B5674;background:none;color:#fff;border-radius:5px;padding:5px 10px;font-size:.8rem;font-weight:600;cursor:pointer}
.ovh .x{margin-left:auto;border:0;background:none;color:#fff;font-size:1.9rem;line-height:1;padding:0 4px 2px;cursor:pointer}
.ovb{display:grid;gap:12px;padding:12px max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(12px,env(safe-area-inset-left,0px))}
.ovb .pl{font-size:.8rem;color:var(--ink-2);font-family:var(--mono)}
.nowbtn{font-family:var(--mono);letter-spacing:.04em;white-space:nowrap}
.nowbtn.on{background:#FF6A5E;border-color:#FF6A5E;color:#fff}
.ring{position:relative;overflow:hidden}
.ring .rest{position:absolute;left:0;bottom:0;height:3px;background:var(--ink-3);opacity:.7;border-radius:0 2px 0 0;transition:width .6s}
.ring.quiet .rest{opacity:.35}
.nowbtn.tog[aria-pressed="true"]{background:#fff;color:#0C1B29;border-color:#fff}
.nowbtn .off{font-size:.72rem;opacity:.85;margin-left:4px}
.ring .who{display:flex;flex-direction:column;gap:3px;margin-top:2px}
.ring .who .pn{font-size:.8rem}

  for (let r=1;r<=8;r++){
    const b = current(S.day, r, S.t);
    const bi = b && b.cat ? info(b.t) : null;
    let body = `<div class="top"><span class="num">${r}</span>${bi ? belt(bi,'big') + weight(bi,'big') : ''}${bi ? icon(bi.k) : ''}</div>`;
    // a final only holds the two who went through, so listing the whole class would look like the earlier round
    if (bi && S.names && final(b)) body += `<div class="fin">${b.ph === 'Finale' ? 'FINALE' : 'REPECHAGE'}</div>`;
    else if (bi && S.names) body += `<div class="who">${people(b)}</div>`;
    else if (bi) body += `<div class="cls">${nameTag(bi)}</div><div class="when">${b.ph?esc(b.ph)+' · ':''}${hm(b.s)}–${hm(b.e)}</div>`;
    else body += `<div class="when">${b && b.lunch ? 'Lunsj til '+hm(b.e) : 'Ledig'}</div>`;
    const el = document.createElement('button');
    // a class starting at the shown time is marked, so after Neste it is clear which ring changed
    el.type = 'button'; el.className = 'ring' + (bi ? (has(b) ? '' : ' quiet') : ' idle') + (S.ring===r ? ' sel' : '') + (bi && b.s === S.t ? ' starting' : '');
    el.style.gridColumn = POS[r][0]; el.style.gridRow = POS[r][1];
    el.setAttribute('aria-label', `Ring ${r}`);
    // remaining share of the class: full when it starts, empty when it ends
    if (bi) body += `<i class="rest" style="width:${Math.max(0, Math.min(100, (b.e - S.t) / (b.e - b.s) * 100)).toFixed(1)}%"></i>`;
    el.innerHTML = body;
    el.onclick = () => {
      S.ring = S.ring===r || !bi ? null : r;
      render();
    };
    hall.appendChild(el);
  }
}

// a class split into pools has one sheet per ring; finals show every sheet of the class
function sheetsFor(b){
  const pgs = (catpages[b.cat]||[]).map(i => sheets[i]);
  return pgs.length > 1 && !final(b) ? pgs.filter(s => s.ring === b.r) : pgs;
}

const LV = ['Internasjonalt', 'Nasjonalt (NM)', 'Regionalt', 'LM (gup)'];
const MED = ['', 'gull', 'sølv', 'bronse'];
// a candidate's medals by level, international first, so the strongest results are read first
function profileHtml(c, s){
  const ms = (DATA.medals || {})[c.n] || [];
  const parts = c.n.split(' '), ini = (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
  const count = (lv, pl) => ms.filter(m => m[0] === lv && m[4] === pl).length;
  let h = `<div class="prof ${c.age || 's'}"><div class="pph">${PHOTOS[c.n] ? `<img src="${PHOTOS[c.n]}" alt="${esc(c.n)}">` : `<span class="ini">${ini}</span>`}</div>
    <div class="pinfo"><div class="pnm">${esc(c.n)}</div><div class="pclub">${esc(c.c || '')}${c.l ? ` · ${c.l === 'JR' ? 'junior' : 'senior'} 2027` : ''}</div>${s.bout ? `<div>Kamp <b class="bn ${s.cor}">${s.bout}</b></div>` : ''}</div></div>`;
  h += selProfile(c.n);

  }

}

// the sheet opens over the overview so the overview keeps its scroll position on a phone

const DAY0 = 510, PPM = 2.4; // minutes from 08:30, pixels per minute
// first name and surname initial keep a column narrow enough for eight rings on a phone
// a split class has one sheet per ring, so take the start that belongs to this ring
const startIn = (c, b) => c.st.find(x => x.cat===b.cat && (x.ring==null || x.ring===b.r));
const people = b => who(b).map(c => ({c, s: startIn(c, b) || {}}))

function renderDay(){

    if (b.lunch){ h += `<div class="blk lunch" style="top:${top}px;height:${ht}px;left:${left}">Lunsj</div>`; continue; }

      + (short ? (b.ph ? `<span class="tt">${esc(b.ph)}</span>` : '') : `<span class="bw">${belt(i)}${weight(i)}</span>${people(b)}`)

// live follows the wall clock; before the event it uses Saturday so the mode can be tried out, after it Sunday
function liveNow(){
  const d = new Date(), k = d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
  return {day: k >= 20261108 ? 'sun' : 'sat', t: Math.max(510, Math.min(1015, d.getHours()*60 + d.getMinutes()))};
}
// how far the shown time is from now, so a look ahead is never mistaken for the present
function offset(){
  const n = liveNow(), d = (S.day === 'sun' ? 1440 : 0) - (n.day === 'sun' ? 1440 : 0) + S.t - n.t;
  if (!d) return '';
  const a = Math.abs(d), sign = d > 0 ? '+' : '−';
  if (a >= 720) return `${sign}${S.day === 'sun' ? 'søn' : 'lør'}`;
  return sign + span(a);
}
const span = a => a >= 60 ? `${Math.floor(a/60)}t${String(a%60).padStart(2,'0')}` : `${a} min`;
// the previous start of a class with candidates, the mirror of nextStart
function prevStart(){
  const n = blocks.filter(x => x.d === S.day && x.cat && !final(x) && x.s < S.t && has(x)).sort((a, b) => b.s - a.s)[0];
  return n ? n.s : null;
}
// the next start of a class with candidates; finals are skipped so each press lands on a new class
function nextStart(){
  const n = blocks.filter(x => x.d === S.day && x.cat && !final(x) && x.s > S.t && has(x)).sort((a, b) => a.s - b.s)[0];
  return n ? n.s : null;
}
// the dock: the shown time large in the middle, how far it is from now under it, and the gaps to the neighbouring class starts
function liveBtn(){
  const b = $('now'); b.hidden = false;
  b.classList.toggle('on', S.live); b.setAttribute('aria-pressed', S.live);
  b.innerHTML = `<b class="ck" id="clock">${hm(S.t)}</b><span class="sub">${S.live ? '● LIVE' : offset() || '● nå'}</span>`;
  b.title = S.live ? 'Følger klokka' : 'Tilbake til nå';
  const n = nextStart(), p = prevStart();
  $('next').disabled = n == null; $('prev').disabled = p == null;
  $('next').innerHTML = `Neste${n == null ? '' : ` <span class="gap">(+${n - S.t < 60 ? n - S.t : span(n - S.t)})</span>`} ›`;
}
function goLive(){
  S.live = true; Object.assign(S, liveNow()); render();
  if (S.view === 'day') $('day').scrollTop = Math.max(0, (S.t-DAY0)*PPM - 120);
}
function leaveLive(){ if (S.live){ S.live = false; liveBtn(); } }
// a tick redraws the overview only, so an open draw sheet does not flicker while it is being read
function tick(){
  if (!S.live){ liveBtn(); return; }
  const n = liveNow();
  if (n.day === S.day && n.t === S.t) return;
  Object.assign(S, n);
  $('t').value = S.t; liveBtn();
  document.querySelectorAll('[data-day]').forEach(b => b.setAttribute('aria-pressed', b.dataset.day===S.day));
  if (S.view === 'day') renderDay(); else renderHall();
}

function render(){
  S.t = Math.max(510, Math.min(1015, S.t));
  $('t').value = S.t;
  document.querySelectorAll('[data-day]').forEach(b => b.setAttribute('aria-pressed', b.dataset.day===S.day));
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', b.dataset.view===S.view));
  const dayView = S.view === 'day', uv = S.view === 'uttak';
  $('hall').hidden = dayView || uv; $('day').hidden = !dayView; $('t').hidden = dayView; $('uttak').hidden = !uv;
  document.querySelector('.dock').hidden = uv;
  if (S.dsel && S.dsel.d !== S.day) S.dsel = null;
  $('panel').style.order = dayView ? 2 : 0; $('day').style.order = dayView ? 1 : 0;
  if (uv) renderUttak(); else if (dayView) renderDay(); else renderHall();
  renderPanel();
  liveBtn();
  document.querySelectorAll('[data-grp]').forEach(b => b.setAttribute('aria-pressed', b.dataset.grp === S.grp));
  $('names').setAttribute('aria-pressed', S.names); $('names').hidden = S.view === 'day';
  store.set('day', S.day); store.set('t', S.t); store.set('view', S.view);

document.querySelectorAll('[data-day]').forEach(b => b.onclick = () => { leaveLive(); S.day = b.dataset.day; S.ring = null; render(); });
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => {
  S.view = b.dataset.view; render();
  // open the day view at the chosen time rather than at 08:30
  if (S.view === 'day') $('day').scrollTop = Math.max(0, (S.t-DAY0)*PPM - 120);
});
$('t').oninput = e => { leaveLive(); S.t = +e.target.value; render(); };
$('now').onclick = goLive;
const jump = t => {
  if (t == null) return;
  leaveLive(); S.t = t; render();
  if (S.view === 'day') $('day').scrollTop = Math.max(0, (S.t-DAY0)*PPM - 120);

$('next').onclick = () => jump(nextStart());
$('prev').onclick = () => jump(prevStart());
$('names').onclick = () => { S.names = !S.names; store.set('names', S.names); render(); };
document.querySelectorAll('[data-grp]').forEach(b => b.onclick = () => { S.grp = S.grp === b.dataset.grp ? '' : b.dataset.grp; store.set('grp', S.grp); render(); });
// ---- team selection, shared live between the coaches ----
// Choices live in a Firebase Realtime Database when DATA.fb is set, otherwise only on this device.
// Every entry is encrypted with the coaches' code before it leaves the phone, so the public page and the
// database reveal nothing about the selection; entry ids are hashes, so names never appear in the database.
const SEL_DB = (DATA.fb || '').replace(/\/$/, '');
const CATS = DATA.cats || [];
const catsOf = n => CATS.filter(c => c.x.includes(n));
const SEL = {s: {}, key: null, code: '', ok: false, err: '', live: false, raw: {}};
const selKey = (k, n) => k + '|' + n;
const selGet = (k, n) => SEL.s[selKey(k, n)] || 'aktuell';
const selCount = c => c.x.filter(n => selGet(c.k, n) === 'uttatt').length;
function selOverall(n){
  if (!SEL.ok) return '';
  const cs = catsOf(n); if (!cs.length) return '';
  const v = cs.map(c => selGet(c.k, n));
  return v.includes('uttatt') ? 'uttatt' : v.every(x => x === 'ute') ? 'ute' : '';
}
const selMark = n => selOverall(n) === 'uttatt' ? '<i class="okm" title="Tatt ut">✓</i>' : '';
const selCls = n => { const o = selOverall(n); return o ? ' sel-' + o : ''; };
const catLabel = c => `${c.t.replace(/ sr | jr /, ' ')} · ${c.n}`;

const te = new TextEncoder(), td = new TextDecoder();
const b64 = a => btoa(String.fromCharCode(...new Uint8Array(a)));
const unb64 = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
async function deriveKey(code){
  const base = await crypto.subtle.importKey('raw', te.encode(code), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name: 'PBKDF2', salt: te.encode('nm26-uttak-2027'), iterations: 150000, hash: 'SHA-256'},
    base, {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']);
}
async function enc(obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name: 'AES-GCM', iv}, SEL.key, te.encode(JSON.stringify(obj)));
  return {iv: b64(iv), ct: b64(ct)};
}
async function dec(e){
  const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: unb64(e.iv)}, SEL.key, unb64(e.ct));
  return JSON.parse(td.decode(pt));
}
async function hid(s){
  const h = await crypto.subtle.digest('SHA-256', te.encode(SEL.code + '|' + s));
  return [...new Uint8Array(h)].slice(0, 12).map(b => b.toString(16).padStart(2, '0')).join('');
}
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

function selRefresh(){
  if (S.view === 'uttak') renderUttak();
  else if (S.view === 'day') renderDay(); else renderHall();
  if (!$('panel').hidden) renderPanel();
}
async function absorb(){
  const s = {};
  for (const e of Object.values(SEL.raw)) {
    if (!e || !e.ct) continue;
    try { const o = await dec(e); s[o.k] = o.v; } catch {}
  }
  SEL.s = s; selRefresh();
}
function stream(){
  const es = new EventSource(`${SEL_DB}/uttak/s.json`);
  const apply = (ev, merge) => {
    const m = JSON.parse(ev.data); if (!m) return;
    const id = m.path.replace(/^\//, '');
    if (!id) SEL.raw = merge ? Object.assign(SEL.raw, m.data || {}) : (m.data || {});
    else if (m.data == null) delete SEL.raw[id]; else SEL.raw[id] = m.data;
    absorb();
  };
  es.addEventListener('put', ev => apply(ev, false));
  es.addEventListener('patch', ev => apply(ev, true));
  es.onopen = () => { SEL.live = true; selRefresh(); };
  es.onerror = () => { SEL.live = false; selRefresh(); };
}
async function selConnect(code){
  SEL.err = '';
  if (!SEL_DB){ SEL.ok = true; SEL.s = lsGet('nm26.sel', {}); return; }
  try {
    SEL.code = code; SEL.key = await deriveKey(code);
    const r = await fetch(`${SEL_DB}/uttak/check.json`); const chk = await r.json();
    if (chk == null) {
      // the first code ever used becomes the coaches' code
      await fetch(`${SEL_DB}/uttak/check.json`, {method: 'PUT', body: JSON.stringify(await enc({ok: 'nm26'}))});
    } else {
      try { await dec(chk); } catch { SEL.err = 'Feil trenerkode'; SEL.key = null; selRefresh(); return; }
    }
    lsSet('nm26.code', code); SEL.ok = true; stream(); selRefresh();
  } catch (e) { SEL.err = 'Får ikke kontakt med lagringen'; selRefresh(); }
}
async function selSet(k, n, v){
  if (!SEL.ok) return;
  const key = selKey(k, n);
  if (v === 'aktuell') delete SEL.s[key]; else SEL.s[key] = v;
  selRefresh();
  if (!SEL_DB) { lsSet('nm26.sel', SEL.s); return; }
  const id = await hid(key);
  await fetch(`${SEL_DB}/uttak/s/${id}.json`, {method: 'PUT', body: JSON.stringify(await enc({k: key, v, t: Date.now()}))}).catch(() => { SEL.err = 'Lagring feilet, prøv igjen'; selRefresh(); });
}

const codeForm = () => `<p class="hint">Uttaket vises bare når siden er åpnet med trenerlenken.${SEL.err ? ` <b class="over">${esc(SEL.err)}</b>` : ''}</p>`;
const seg3 = (k, n) => { const v = selGet(k, n); return `<div class="seg3">${[['ute','Ute'],['aktuell','Aktuell'],['uttatt','Tatt ut']].map(([val, lab]) => `<button type="button" data-selk="${esc(k)}" data-seln="${esc(n)}" data-selv="${val}" aria-pressed="${v === val}">${lab}</button>`).join('')}</div>`; };
function selProfile(n){
  const cs = catsOf(n); if (!cs.length) return '';
  if (!SEL.ok) return `<div class="selbox"><h3 class="mh">Uttak</h3>${codeForm()}</div>`;
  return `<div class="selbox"><h3 class="mh">Uttak</h3>${cs.map(c => { const k = selCount(c); return `<div class="selrow"><div class="sl"><b>${esc(catLabel(c))}</b><span class="${k > 2 ? 'over' : ''}">Tatt ut ${k}/2</span></div>${seg3(c.k, n)}</div>`; }).join('')}</div>`;
}
function renderUttak(){
  const el = $('uttak');
  const status = !SEL_DB ? '<p class="selnote">Ikke koblet til delt lagring ennå. Valgene lagres bare på denne enheten.</p>'
    : !SEL.ok ? `<div class="selnote">${codeForm()}</div>`
    : `<p class="selnote ${SEL.live ? 'on' : ''}">${SEL.live ? '● Delt live med de andre trenerne' : 'Kobler til …'}${SEL.err ? ' · ' + esc(SEL.err) : ''}</p>`;
  let h = status;
  if (SEL.ok) for (const g of ['SENIOR', 'JUNIOR']) {
    h += `<h2 class="ug">${g}</h2>`;
    for (const c of CATS.filter(c => c.g === g)) {
      const k = selCount(c), order = {uttatt: 0, aktuell: 1, ute: 2};
      const xs = [...c.x].sort((a, b) => order[selGet(c.k, a)] - order[selGet(c.k, b)]);
      h += `<section class="ucat ${c.kind}"><div class="uh"><b>${esc(catLabel(c))}</b><span class="cnt${k > 2 ? ' over' : k === 2 ? ' full' : ''}">${k}/2</span></div>`
        + xs.map(n => { const v = selGet(c.k, n); return `<div class="urow ${v}"><span class="un">${PHOTOS[n] ? `<img src="${PHOTOS[n]}" alt="" loading="lazy">` : '<i class="noimg"></i>'}${v === 'uttatt' ? '<i class="okm">✓</i>' : ''}${esc(n)}</span>${seg3(c.k, n)}</div>`; }).join('')
        + `</section>`;
    }
  }
  el.innerHTML = h;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-selv]'); if (!b) return;
  e.stopPropagation(); selSet(b.dataset.selk, b.dataset.seln, b.dataset.selv);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('.codeform'); if (!f) return;
  e.preventDefault(); const code = f.code.value.trim(); if (code) selConnect(code);
});

// every visit starts live; scrolling back in time is a deliberate, temporary look
goLive();
// the coaches' link carries the code in the hash (#uttak-<code>); it is remembered and then removed from the address bar
{
  const m = location.hash.match(/^#uttak-(.+)$/);
  if (m) { lsSet('nm26.code', decodeURIComponent(m[1])); try { history.replaceState(history.state, '', location.pathname + location.search); } catch {} }
}
const startCode = DATA.selcode || lsGet('nm26.code', '');
if (!SEL_DB) selConnect(''); else if (startCode) selConnect(startCode);
setInterval(tick, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
</script>
